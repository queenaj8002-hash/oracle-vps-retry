name: Provision Oracle VPS

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Install OCI CLI and jq
        run: |
          python -m pip install oci-cli
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Configure OCI credentials
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.oci"
          chmod 700 "$HOME/.oci"

          printf '%s\n' "$OCI_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"

          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_KEY_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/oci_api_key.pem
          EOF

          chmod 600 "$HOME/.oci/config"
          echo "Memeriksa koneksi dan region OCI..."
          oci iam availability-domain list \
            --compartment-id "$OCI_TENANCY_OCID" \
            --output table

      - name: Check existing instance
        id: check
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Mengambil daftar instance dari OCI..."
          oci compute instance list \
            --compartment-id "$OCI_TENANCY_OCID" \
            --all \
            --output json > instances.json

          echo "Memvalidasi respons OCI..."
          if ! jq -e '(.data | type) == "array"' instances.json >/dev/null; then
            echo "ERROR: Respons OCI bukan daftar instance yang valid."
            exit 1
          fi

          COUNT=$(jq '.data | length' instances.json)
          echo "Jumlah instance yang ditemukan: $COUNT"

          echo "Nama dan status instance:"
          jq -r '.data[]? | [
            (."display-name" // "(tanpa nama)"),
            (."lifecycle-state" // "(status tidak diketahui)"),
            (.id // "(OCID tidak tersedia)")
          ] | @tsv' instances.json

          MATCH=$(jq -r '[
            .data[]?
            | select(
                ."display-name" == "hermes-vps"
                and ."lifecycle-state" != "TERMINATED"
                and ."lifecycle-state" != "TERMINATING"
              )
          ] | length' instances.json)

          if [[ "$MATCH" -gt 0 ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Instance hermes-vps ditemukan."
            echo "Pembuatan instance baru dilewati untuk mencegah duplikat."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Instance hermes-vps belum ditemukan."
            echo "Melanjutkan pemeriksaan image."
          fi

      - name: Find Ubuntu 24.04 image
        id: image
        if: steps.check.outputs.exists == 'false'
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Mencari image Ubuntu 24.04 untuk VM.Standard.A1.Flex..."
          oci compute image list \
            --compartment-id "$OCI_TENANCY_OCID" \
            --operating-system "Canonical Ubuntu" \
            --operating-system-version "24.04" \
            --shape "VM.Standard.A1.Flex" \
            --all \
            --output json > images.json

          if ! jq -e '(.data | type) == "array"' images.json >/dev/null; then
            echo "ERROR: Respons daftar image tidak valid."
            exit 1
          fi

          IMAGE_ID=$(jq -r '[
            .data[]?
            | select(.id != null)
          ] | sort_by(."time-created" // "") | last | .id // empty' images.json)

          if [[ -z "$IMAGE_ID" || "$IMAGE_ID" == "null" ]]; then
            echo "ERROR: Image Ubuntu 24.04 yang cocok tidak ditemukan."
            exit 1
          fi

          echo "image_id=$IMAGE_ID" >> "$GITHUB_OUTPUT"
          echo "Image yang cocok ditemukan."

      - name: Try to create VPS
        if: steps.check.outputs.exists == 'false'
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          IMAGE_ID: ${{ steps.image.outputs.image_id }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$OCI_SSH_PUBLIC_KEY" || -z "$OCI_SUBNET_OCID" ]]; then
            echo "ERROR: SSH public key atau subnet kosong."
            exit 1
          fi

          printf '%s\n' "$OCI_SSH_PUBLIC_KEY" > "$RUNNER_TEMP/ssh_public_key"
          chmod 600 "$RUNNER_TEMP/ssh_public_key"

          ADS=(
            "NBFs:US-ASHBURN-AD-1"
            "NBFs:US-ASHBURN-AD-2"
            "NBFs:US-ASHBURN-AD-3"
          )

          for AD in "${ADS[@]}"; do
            echo "Mencoba membuat hermes-vps di $AD..."

            if oci compute instance launch \
              --availability-domain "$AD" \
              --compartment-id "$OCI_TENANCY_OCID" \
              --display-name "hermes-vps" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":2,"memoryInGBs":12}' \
              --image-id "$IMAGE_ID" \
              --subnet-id "$OCI_SUBNET_OCID" \
              --assign-public-ip true \
              --ssh-authorized-keys-file "$RUNNER_TEMP/ssh_public_key" \
              --wait-for-state RUNNING \
              --max-wait-seconds 900 \
              --output json > launch-result.json 2> launch-error.log; then

              echo "Permintaan pembuatan VPS berhasil."
              jq '{
                id: .data.id,
                name: .data."display-name",
                state: .data."lifecycle-state",
                availability_domain: .data."availability-domain"
              }' launch-result.json
              exit 0
            else
              echo "Percobaan di $AD gagal."
              cat launch-error.log

              if ! grep -Eqi \
                'out of host capacity|capacity.*unavailable|not available in.*availability domain' \
                launch-error.log; then
                echo "ERROR: Kegagalan bukan masalah kapasitas yang dikenali."
                echo "Proses dihentikan agar penyebabnya dapat diperiksa."
                exit 1
              fi
            fi
          done

          echo "Kapasitas A1 belum tersedia di ketiga Availability Domain."
          exit 1

      - name: VPS already exists
        if: steps.check.outputs.exists == 'true'
        run: |
          echo "Instance hermes-vps sudah ditemukan melalui API OCI."
          echo "Tidak membuat instance duplikat."
          echo "Periksa OCID dan status pada log Check existing instance."
